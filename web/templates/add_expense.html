{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>הוסף הוצאה</h1>
    <form method="POST">
        <label>סכום (₪)</label>
        <input type="number" name="amount" step="0.01" min="0.01" required placeholder="49.90">

        <label>תיאור</label>
        <input type="text" name="description" required placeholder="מה קנית?">

        <label>קטגוריה</label>
        <select name="category" required>
            {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
        </select>

        <div class="checkbox-row">
            <input type="checkbox" name="is_essential" id="is_essential" value="1">
            <label for="is_essential" style="margin: 0;">הוצאה נצרכת</label>
        </div>

        <label>שולם ע"י</label>
        <select name="paid_by" required>
            {% for p in partners %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
        </select>

        <label>תאריך ושעה</label>
        <input type="datetime-local" name="expense_ts" value="{{ default_datetime }}">

        <button type="submit" class="btn btn-primary btn-block">💾 שמור</button>
    </form>
</div>
{% endblock %}
