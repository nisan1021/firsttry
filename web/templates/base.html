<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couples Expenses</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }
        .navbar {
            background: #4e79a7;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .navbar a:hover, .navbar a.active {
            background: rgba(255,255,255,0.2);
        }
        .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 { font-size: 22px; margin-bottom: 16px; }
        h2 { font-size: 18px; margin-bottom: 12px; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            margin-top: 12px;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], input[type="password"],
        input[type="datetime-local"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            direction: rtl;
        }
        input:focus, select:focus { outline: none; border-color: #4e79a7; }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        .checkbox-row input { width: auto; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #4e79a7; color: white; }
        .btn-danger { background: #e15759; color: white; }
        .btn-success { background: #59a14f; color: white; }
        .btn-block { width: 100%; margin-top: 16px; }
        .flash {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .flash-success { background: #d4edda; color: #155724; }
        .flash-error { background: #f8d7da; color: #721c24; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px 8px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        th { background: #f8f9fa; font-weight: 600; }
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filters select { width: auto; min-width: 120px; }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .kpi-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .kpi-value { font-size: 24px; font-weight: 700; color: #4e79a7; }
        .kpi-label { font-size: 13px; color: #666; margin-top: 4px; }
        .chart-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .chart-box { position: relative; height: 300px; }
        @media (max-width: 600px) {
            .navbar { padding: 8px; }
            .navbar a { padding: 6px 10px; font-size: 13px; }
            .container { padding: 0 10px; margin: 12px auto; }
            .card { padding: 16px; }
            .filters select { min-width: 100px; font-size: 13px; }
            table { font-size: 12px; }
            th, td { padding: 8px 4px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
    {% if session.get('logged_in') %}
    <nav class="navbar">
        <div class="nav-links">
            <a href="{{ url_for('add_expense') }}" class="{{ 'active' if request.endpoint == 'add_expense' }}">➕ הוסף הוצאה</a>
            <a href="{{ url_for('expense_list') }}" class="{{ 'active' if request.endpoint == 'expense_list' }}">📋 רשימה</a>
            <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">📊 דשבורד</a>
        </div>
        <a href="{{ url_for('logout') }}">יציאה</a>
    </nav>
    {% endif %}

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
